<!doctype html><html lang="ja"><meta charset="UTF-8"><title>MONSTER TRAIL — Browser gameplay verification</title><style>body{margin:0;background:#102c35;color:#edfade;font:13px monospace}header{height:48px;padding:10px 20px;box-sizing:border-box;display:flex;gap:20px;align-items:center}button{background:#c6f87b;color:#183c31;border:0;padding:8px 16px;cursor:pointer}iframe{width:100%;height:calc(100vh - 170px);border:0;display:block}pre{margin:0;height:120px;overflow:auto;padding:10px 20px;box-sizing:border-box;white-space:pre-wrap}b{color:#c6f87b}</style>
<header><b>MONSTER TRAIL / REAL BROWSER INPUT TEST</b><button id="run">RUN PLAYTHROUGH</button><button id="aquari">AQUARI VISUAL CHECK</button><span id="status">Ready</span></header><iframe id="game" title="検証用ゲーム"></iframe><pre id="log"></pre>
<script type="module">
const frame=document.getElementById('game'),output=document.getElementById('log'),status=document.getElementById('status');
import {initialSave,makeMonster} from '../src/rules.js';
const wait=ms=>new Promise(r=>setTimeout(r,ms));const log=text=>{output.textContent+=text+'\n';output.scrollTop=output.scrollHeight;console.log(text);};
let win,doc;const state=()=>win.monsterTrail.getState();
async function until(predicate,timeout=12000){const start=Date.now();while(!predicate()){if(Date.now()-start>timeout)throw new Error('Timed out: '+predicate.toString()+' state='+JSON.stringify(win.monsterTrail?.getState()));await wait(45);}}
function key(code,type='keydown'){win.dispatchEvent(new KeyboardEvent(type,{code,key:code.startsWith('Key')?code.slice(3).toLowerCase():code,bubbles:true}));}
function tap(code){key(code);key(code,'keyup');}
function click(text){const button=[...doc.querySelectorAll('button')].find(b=>b.textContent.startsWith(text)&&!b.disabled&&b.getClientRects().length);if(!button)throw new Error('Button unavailable: '+text);button.click();}
async function move(code,axis,target,timeout=15000){const initial=state().player[axis],sign=Math.sign(target-initial);key(code);try{await until(()=>state().mode!=='field'||sign*(state().player[axis]-target)>=0,timeout);}finally{key(code,'keyup');}await wait(100);}
async function commandReady(){await until(()=>state().mode==='battle'&&state().battle&&!state().battle.busy,12000);}
async function attack(name){click('たたかう');click(name);await until(()=>state().battle.ended||!state().battle.busy,15000);}
async function returnField(){click('街の探索に戻る');await until(()=>state().mode==='field');await wait(350);}
document.getElementById('aquari').onclick=async()=>{document.getElementById('aquari').disabled=true;document.getElementById('run').disabled=true;try{const fixture=initialSave();fixture.team.push({...makeMonster('Leafy'),xp:30});fixture.active=1;fixture.position={x:21,z:-16};fixture.metResearcher=true;localStorage.setItem('monster-trail-save-v1-qa',JSON.stringify(fixture));status.textContent='Finding Aquari';frame.src='/?qa=1&aquari=1';await new Promise(r=>frame.onload=r);win=frame.contentWindow;doc=frame.contentDocument;await until(()=>win.monsterTrail&&state().mode==='title');doc.getElementById('start').click();await until(()=>state().mode==='field');await wait(500);for(let i=0;i<15&&state().mode==='field';i++)await move(i%2?'KeyA':'KeyD','x',i%2?18:24.5);await commandReady();status.textContent='AQUARI READY';log('Aquari visual scenario ready. Use the battle UI to attack, capture, level up and return.');}catch(e){log('FAIL '+e.stack);status.textContent='FAILED';}finally{document.getElementById('aquari').disabled=false;document.getElementById('run').disabled=false;}};
document.getElementById('run').onclick=async()=>{document.getElementById('run').disabled=true;output.textContent='';status.textContent='Running';try{
localStorage.removeItem('monster-trail-save-v1-qa');frame.src='/?qa=1';await new Promise(r=>frame.onload=r);win=frame.contentWindow;doc=frame.contentDocument;await until(()=>win.monsterTrail&&state().mode==='title');
const errors=[];win.addEventListener('error',e=>errors.push(e.message));log('PASS title rendered / 12 NPCs: '+state().npcCount);doc.getElementById('start').click();await until(()=>state().mode==='field');await wait(500);
tap('KeyE');await until(()=>state().mode==='dialog');if(!doc.getElementById('dialog-name').textContent.includes('研究家'))throw new Error('Wrong NPC');log('PASS START GAME → field → E conversation with researcher');tap('KeyE');await until(()=>state().mode==='field');
await move('KeyS','z',18);await move('KeyA','x',-21.5);if(state().mode==='field')await move('KeyS','z',20);log('PASS WASD movement into park: '+JSON.stringify(state().player));
for(let i=0;i<8&&state().mode==='field';i++){await move(i%2?'KeyD':'KeyA','x',i%2?-19:-25);}
await commandReady();log('PASS distance-based wild encounter: '+state().battle.enemy.name);const before=state().battle.enemy.hp;await attack('ぽかぽかタックル');if(state().battle.enemy.hp>=before)throw new Error('Enemy HP did not drop');if(state().team[0].hp>=44)throw new Error('Enemy did not retaliate');log('PASS player damage and enemy turn; HP bars updated');
click('アイテム');click('ポーション');await commandReady();if(state().inventory.potions!==4)throw new Error('Potion not consumed');log('PASS healing item consumes a turn');
while(!state().battle.ended&&state().battle.enemy.hp>12){await attack('ぽかぽかタックル');}
if(state().battle.ended)throw new Error('Enemy fainted before capture');click('アイテム');click('リンクプリズム');await until(()=>state().battle.ended||!state().battle.busy,15000);
if(!state().battle.ended){click('アイテム');click('リンクプリズム');await until(()=>state().battle.ended||!state().battle.busy,15000);}
if(state().team.length!==2)throw new Error('Capture did not add monster');log('PASS capture → collection / XP reward: '+JSON.stringify(state().team));await returnField();log('PASS battle end → same field position');
tap('KeyM');await until(()=>state().mode==='collection');click('この子と冒険する');if(!doc.getElementById('partner-name').textContent.includes('Leafy'))throw new Error('Partner change failed');tap('KeyM');await until(()=>state().mode==='field');log('PASS collection UI and partner switching');
// Leave park, use the central sidewalk to reach the cafe, verify recovery.
await move('KeyW','z',18);await move('KeyD','x',-5);await move('KeyW','z',-15);await move('KeyA','x',-13.5);tap('KeyE');await until(()=>state().mode==='dialog');if(!doc.getElementById('dialog-name').textContent.includes('カフェ'))throw new Error('Cafe not reached');if(state().inventory.potions<5)throw new Error('Cafe did not replenish');tap('KeyE');log('PASS cafe recovery and replenishment');
// Walk into the north-west building and check that the player cannot enter it.
await move('KeyW','z',-20);const oldx=state().player.x;key('KeyA');await wait(1300);key('KeyA','keyup');if(state().player.x< -14.1)throw new Error('Wall collision failed');log('PASS building collision at x='+state().player.x.toFixed(2));
// Return to park for a win with both moves and a level-up.
await move('KeyS','z',-15);await move('KeyD','x',-5);await move('KeyS','z',18);await move('KeyA','x',-21.5);for(let i=0;i<8&&state().mode==='field';i++)await move(i%2?'KeyD':'KeyA','x',i%2?-19:-25);await commandReady();
let turns=0;while(!state().battle.ended&&turns++<10){if(state().team.find(m=>m.name==='Leafy').hp<19&&state().inventory.potions>0){click('アイテム');click('ポーション');await until(()=>state().battle.ended||!state().battle.busy,15000);}else await attack(turns%2?'リーフスピン':'どんぐりショット');}
if(!doc.getElementById('battle-message').textContent.includes('勝利'))throw new Error('Victory not reached');log('PASS two moves → victory → XP');await returnField();
tap('Escape');await until(()=>state().mode==='help');tap('Escape');await until(()=>state().mode==='field');log('PASS help dialog / ESC');
const savedTeam=JSON.stringify(state().team);frame.src='/?qa=1&reload=1';await new Promise(r=>frame.onload=r);win=frame.contentWindow;doc=frame.contentDocument;await until(()=>win.monsterTrail&&state().mode==='title');if(JSON.stringify(state().team)!==savedTeam)throw new Error('Save persistence failed');log('PASS auto-save after reload / CONTINUE TRAIL');doc.getElementById('start').click();await until(()=>state().mode==='field');
for(let i=0;i<8&&state().mode==='field';i++)await move(i%2?'KeyD':'KeyA','x',i%2?-19:-25);await commandReady();click('にげる');await until(()=>state().battle.ended);await returnField();log('PASS escape command and field return');
if(errors.length)throw new Error(errors.join('\n'));log('PASS no uncaught browser errors. Draw calls: '+state().draws+' / Triangles: '+state().triangles);status.textContent='ALL CHECKS PASSED';
}catch(e){log('FAIL '+e.stack);status.textContent='FAILED';}finally{document.getElementById('run').disabled=false;}};
</script></html>
